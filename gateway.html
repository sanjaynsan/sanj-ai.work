<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanjay Kumar V — Computational Designer</title>
  <meta name="description" content="Portfolio of Sanjay Kumar V, Computational Designer specializing in Urban Intelligence, Architecture, Generative AI and AEC Automation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gateway.css">
</head>
<body>

  <!-- HERO: full viewport with particle canvas -->
  <section class="hero-section">
    <canvas id="particle-canvas"></canvas>
    <div class="hero-content">
      <p class="hero-greeting">Welcome</p>
      <h1 class="name">Sanjay Kumar V</h1>
      <div class="typewriter-wrap">
        <span class="typewriter-text" id="typewriter"></span>
        <span class="cursor">|</span>
      </div>
    </div>
    <div class="scroll-hint">
      <p class="scroll-text">What would you like to explore?</p>
      <div class="scroll-arrow"></div>
    </div>
  </section>

  <!-- CARDS: revealed on scroll -->
  <section class="cards-section" id="cards-section">
    <div class="audience-cards" id="audience-cards">

      <a href="urban/" class="audience-card" data-accent="#7ecec1">
        <div class="card-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="28" width="8" height="16" fill="currentColor" opacity="0.9"/>
            <rect x="14" y="20" width="8" height="24" fill="currentColor" opacity="0.7"/>
            <rect x="24" y="12" width="8" height="32" fill="currentColor" opacity="0.9"/>
            <rect x="34" y="22" width="10" height="22" fill="currentColor" opacity="0.6"/>
            <line x1="4" y1="44" x2="44" y2="44" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <h2 class="card-title">Urban & Planetary</h2>
        <p class="card-sub">Cities, data, climate &amp; computation</p>
        <span class="card-arrow">&rarr;</span>
      </a>

      <a href="architecture/" class="audience-card" data-accent="#f2a7a7">
        <div class="card-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 44 L24 8 L44 44" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
            <path d="M12 44 L24 20 L36 44" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.5"/>
            <line x1="4" y1="44" x2="44" y2="44" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <h2 class="card-title">Architecture & Parametrism</h2>
        <p class="card-sub">Space, structure, material &amp; craft</p>
        <span class="card-arrow">&rarr;</span>
      </a>

      <a href="computation/" class="audience-card" data-accent="#c4b5fd">
        <div class="card-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="5" fill="currentColor"/>
            <circle cx="8" cy="12" r="3" fill="currentColor" opacity="0.7"/>
            <circle cx="40" cy="12" r="3" fill="currentColor" opacity="0.7"/>
            <circle cx="8" cy="36" r="3" fill="currentColor" opacity="0.7"/>
            <circle cx="40" cy="36" r="3" fill="currentColor" opacity="0.7"/>
            <line x1="11" y1="12" x2="19" y2="20" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
            <line x1="37" y1="12" x2="29" y2="20" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
            <line x1="11" y1="36" x2="19" y2="28" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
            <line x1="37" y1="36" x2="29" y2="28" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
          </svg>
        </div>
        <h2 class="card-title">Computation &amp; AI</h2>
        <p class="card-sub">Automation, tools, code &amp; intelligence</p>
        <span class="card-arrow">&rarr;</span>
      </a>

    </div>

    <a href="index.html" class="view-all-link">View all work &darr;</a>
  </section>

  <script src="gateway.js"></script>
</body>
</html>
